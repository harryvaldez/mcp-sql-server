name: Requirements Traceability Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-pr-traceability:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requirement linkage in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = context.payload.pull_request.body || "";
            const hasRequirement = /(Implements|Closes|Fixes|Resolves)\s*:\s*(Closes\s+)?#\d+/i.test(prBody) || /\b(Closes|Fixes|Resolves)\s+#\d+/i.test(prBody);

            if (!hasRequirement) {
              core.setFailed('PR must reference at least one requirement issue. Add \'Implements: #<issue>\' or \'Closes #<issue>\' to the PR body.');
              return;
            }

            const hasAcceptanceCriteria = /acceptance criteria/i.test(prBody);
            if (!hasAcceptanceCriteria) {
              core.warning('PR should include an Acceptance Criteria Verification section.');
            }

            core.info('Traceability check passed.');